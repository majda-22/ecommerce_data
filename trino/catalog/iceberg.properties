connector.name=iceberg

iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=shopflow
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/shopflow
iceberg.jdbc-catalog.connection-user=shopflow
iceberg.jdbc-catalog.connection-password=shopflow
iceberg.jdbc-catalog.default-warehouse-dir=s3://shopflow-lakehouse/warehouse
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY
iceberg.security=ALLOW_ALL

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=minio
s3.aws-secret-key=minio123
s3.path-style-access=true
