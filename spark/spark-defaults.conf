spark.jars.packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.iceberg:iceberg-aws-bundle:1.5.2,org.postgresql:postgresql:42.7.3,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.8,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
spark.jars.ivy /tmp/.ivy2
spark.network.timeout 300s
spark.executor.heartbeatInterval 60s

spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.shopflow org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.shopflow.type jdbc
spark.sql.catalog.shopflow.uri jdbc:postgresql://postgres:5432/shopflow
spark.sql.catalog.shopflow.jdbc.user shopflow
spark.sql.catalog.shopflow.jdbc.password shopflow
spark.sql.catalog.shopflow.warehouse s3://shopflow-lakehouse/warehouse
spark.sql.catalog.shopflow.io-impl org.apache.iceberg.aws.s3.S3FileIO

spark.sql.defaultCatalog shopflow

spark.sql.catalog.shopflow.s3.endpoint http://minio:9000
spark.sql.catalog.shopflow.s3.access-key-id minio
spark.sql.catalog.shopflow.s3.secret-access-key minio123
spark.sql.catalog.shopflow.s3.path-style-access true
spark.sql.catalog.shopflow.s3.region us-east-1
spark.driver.extraJavaOptions -Daws.region=us-east-1
spark.executor.extraJavaOptions -Daws.region=us-east-1

spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minio
spark.hadoop.fs.s3a.secret.key minio123
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
